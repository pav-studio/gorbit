<!doctype html>
<html lang="en">
	<head>

        <style>
            .title {
                font-family: "Geomini", sans-serif;
            }

            html,
            body {
                font-family: "Inconsolata", sans-serif;
            }

            button {
                cursor: pointer;
            }

            html {
                scroll-behavior: smooth;
            }

            .scroll-mt-24 {
                scroll-margin-top: 6rem;
            }

            :global(pre.shiki) {
                display: inline-block;
                min-width: 100%;
            }

            :global(pre.shiki code) {
                white-space: pre;
            }

            :global(.shiki) {
                width: max-content;
                min-width: 100%;
                overflow: visible;
            }

            ::-webkit-scrollbar {
                width: 8px;
                height: 8px;
            }

            ::-webkit-scrollbar-track {
                background: rgba(15, 23, 42, 0);
            }

            ::-webkit-scrollbar-thumb {
                background: linear-gradient(
                    180deg,
                    rgb(249, 251, 252),
                    rgb(128, 129, 129)
                );
                border-radius: 999px;
                border: 0.5px solid rgb(15 23 42);
            }

            ::-webkit-scrollbar-thumb:hover {
                background: linear-gradient(
                    180deg,
                    rgb(56 189 248),
                    rgb(14 165 233)
                );
            }
        </style>


        <title>
            Gorbit - Lightweight & Fast Go Web Framework Inspired by Express.js
        </title>

        <meta
            name="description"
            content="Gorbit is a lightweight, fast, and expressive Go web framework inspired by Express.js. Features include a high-performance HTTP router, middleware, WebSockets, route groups, URL parameters, and an intuitive API for building modern REST APIs and backend services."
        />

        <meta
            name="keywords"
            content="
            gorbit,
            go framework,
            golang framework,
            go web framework,
            golang web framework,
            express for go,
            express.js alternative,
            express inspired go,
            go http framework,
            go router,
            go http router,
            fast go framework,
            lightweight go framework,
            go backend framework,
            go middleware,
            websocket framework,
            golang websocket,
            rest api framework,
            api framework,
            gin alternative,
            fiber alternative,
            echo alternative,
            chi alternative,
            node express in go
            "
        />

        <meta name="author" content="Orbit Technologies" />
        <meta name="robots" content="index,follow,max-image-preview:large" />
        <meta name="language" content="English" />
        <meta name="theme-color" content="#00ADD8" />


        <meta property="og:type" content="website" />

        <meta
            property="og:title"
            content="Gorbit — Lightweight Go Web Framework"
        />

        <meta
            property="og:description"
            content="Fast, lightweight and expressive Go web framework inspired by Express.js. Build REST APIs, WebSockets and scalable backend services with an intuitive API."
        />

        <meta
            property="og:image"
            content="https://gorbit.orbit-technologies.org/icon.png"
        />

        <meta
            property="og:url"
            content="https://gorbit.orbit-technologies.org"
        />

        <meta property="og:site_name" content="Gorbit" />


        <meta name="twitter:card" content="summary_large_image" />

        <meta
            name="twitter:title"
            content="Gorbit — Express.js inspired Go Framework"
        />

        <meta
            name="twitter:description"
            content="A lightweight, fast and expressive Go web framework with middleware, WebSockets, routing and an intuitive Express-like API."
        />

        <meta
            name="twitter:image"
            content="https://gorbit.orbit-technologies.org/icon.png"
        />


        <link
            rel="canonical"
            href="https://gorbit.orbit-technologies.org"
        />

        <script type="application/ld+json">

                "@context": "https://schema.org",

                "name": "Gorbit",

                "license": "https://opensource.org/licenses/MIT",

                    "@type": "Organization",

            }
            </script>

        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Inconsolata:wght@200..900&display=swap" rel="stylesheet">

        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

	</head>
